syntax = "proto3";

package curntvalv.v1;

option go_package = "github.com/Vympel87/curntvalv/internal/pb/curntvalv/v1;pb";

// TxBatch holds the row changes of one Postgres transaction, or a part of it.
// A large transaction is split into several batches with consecutive event
// sequence numbers; only the last one has final = true (design D1).
message TxBatch {
  // LSN of the transaction's commit record.
  uint64 commit_lsn = 1;
  // LSN just after the commit record; what is acknowledged to Postgres.
  uint64 end_lsn = 2;
  // Commit time in microseconds since the Unix epoch.
  int64 commit_time_us = 3;
  uint32 xid = 4;
  // Sequence number of events[0] within the transaction. The idempotency
  // key of an event is (commit_lsn, first_seq + position in events).
  uint32 first_seq = 5;
  bool final = 6;
  // Table schemas used by this batch that the cluster has not stored yet.
  repeated Schema schemas = 7;
  repeated Event events = 8;
  // The Postgres cluster and timeline the batch was read from (design D7):
  // the system identifier and timeline of IDENTIFY_SYSTEM. 0 in batches
  // stored before v0.3.
  uint64 system_id = 9;
  uint32 timeline = 10;
  // Set when the events are a backfill chunk (design D17): rows read from
  // the table, stored at the position of the chunk's high watermark.
  BackfillChunk backfill = 11;
}

// BackfillChunk is the progress a backfill batch makes. The state machine
// applies it only if it continues the stored progress of the same backfill.
message BackfillChunk {
  // "namespace.name" of the table.
  string table = 1;
  // Backfill the chunk belongs to (Backfill.id).
  uint64 id = 2;
  // Primary key the chunk started after (empty for the first chunk) and
  // the last primary key it read, as Postgres text, in key column order.
  repeated bytes after_key = 3;
  repeated bytes last_key = 4;
  // The table has no rows after last_key: the backfill is complete.
  bool done = 5;
}

enum BackfillState {
  BACKFILL_STATE_UNSPECIFIED = 0;
  // Queued or running; one table at a time, in id order.
  BACKFILL_STATE_PENDING = 1;
  BACKFILL_STATE_DONE = 2;
  BACKFILL_STATE_CANCELLED = 3;
  // Stopped by an error that retrying cannot fix (e.g. the table was
  // dropped); error says why.
  BACKFILL_STATE_FAILED = 4;
}

// Backfill is the replicated state of one table's backfill.
message Backfill {
  string table = 1;
  // Raft index of the command that started it.
  uint64 id = 2;
  BackfillState state = 3;
  // Last primary key stored, as Postgres text.
  repeated bytes last_key = 4;
  // Rows stored so far.
  uint64 rows = 5;
  // Raft index at which it finished (done, cancelled or failed).
  uint64 end_index = 6;
  string error = 7;
}

// BackfillCommand is the metadata command that starts, cancels or fails
// backfills (design D17).
message BackfillCommand {
  // Tables ("namespace.name") to backfill. A table with a pending backfill
  // keeps it; otherwise a new one starts from the beginning.
  repeated string start = 1;
  // Tables whose pending backfill stops.
  repeated string cancel = 2;
  // A pending backfill that failed: only the one with this id.
  string fail_table = 3;
  uint64 fail_id = 4;
  string fail_error = 5;
}

enum Op {
  OP_UNSPECIFIED = 0;
  OP_INSERT = 1;
  OP_UPDATE = 2;
  OP_DELETE = 3;
  OP_TRUNCATE = 4;
  // Not a row change: an operator moved the source position (curntvalv
  // source reset), so changes between the old and the new position may be
  // missing or repeated. The event has no schema and carries source_reset.
  OP_SOURCE_RESET = 5;
  // A row read from the table by a backfill (design D17): the row as it was
  // at the event's position. Consumers treat it as an upsert.
  OP_BACKFILL = 6;
}

message Event {
  // Refers to a Schema stored in the state machine.
  uint64 schema_id = 1;
  Op op = 2;
  // Old row image: all columns with REPLICA IDENTITY FULL, otherwise only
  // the key columns, and absent when Postgres does not send it.
  Row before = 3;
  // New row image (insert, update, backfill).
  Row after = 4;
  // Set with OP_SOURCE_RESET.
  SourceReset source_reset = 5;
}

// SourceReset records a move of the source position by an operator.
message SourceReset {
  // Position before the reset: end LSN of the last stored transaction,
  // and the Postgres cluster and timeline it came from (0 if unknown).
  uint64 previous_lsn = 1;
  uint64 previous_system_id = 2;
  uint32 previous_timeline = 3;
  // New position: ingest continues with transactions after lsn.
  uint64 lsn = 4;
  uint64 system_id = 5;
  uint32 timeline = 6;
  // Why ingest had stopped, as reported by the source.
  string reason = 7;
}

message Row {
  // One value per schema column, in column order.
  repeated Value values = 1;
}

enum ValueKind {
  VALUE_KIND_UNSPECIFIED = 0;
  VALUE_KIND_NULL = 1;
  // Postgres text representation in data.
  VALUE_KIND_TEXT = 2;
  // A TOASTed value that did not change; Postgres does not send it.
  VALUE_KIND_UNCHANGED = 3;
  // Postgres binary representation in data.
  VALUE_KIND_BINARY = 4;
}

message Value {
  ValueKind kind = 1;
  bytes data = 2;
}

// Schema describes a table as sent by pgoutput's Relation message.
message Schema {
  // Derived from the content (all other fields), so equal definitions get
  // equal ids on every node.
  uint64 id = 1;
  uint32 relation_oid = 2;
  string namespace = 3;
  string name = 4;
  // 'd' default, 'n' nothing, 'f' full, 'i' index.
  uint32 replica_identity = 5;
  repeated Column columns = 6;
}

message Column {
  string name = 1;
  uint32 type_oid = 2;
  int32 type_modifier = 3;
  // Part of the replica identity key.
  bool key = 4;
}

// Subscription is the replicated state of a named subscription (design
// D22): a position stored in the cluster for a subscriber.
message Subscription {
  string name = 1;
  // Last log index the subscriber has processed; 0 means nothing: it
  // starts with the oldest retained entry.
  uint64 offset = 2;
  // Counts resets; a commit for another generation is ignored.
  uint64 generation = 3;
  // false: retention keeps what the subscription has not read (block).
  bool drop = 4;
  // Raft index of the command that created it.
  uint64 created_index = 5;
}

// SubscriptionCommand is the metadata command that changes subscriptions.
message SubscriptionCommand {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    // Create name at offset with drop, unless it exists.
    ACTION_CREATE = 1;
    // Move the offset forward, in generation only.
    ACTION_COMMIT = 2;
    // Set the offset, also backwards, and start a new generation.
    ACTION_RESET = 3;
    ACTION_DELETE = 4;
  }
  Action action = 1;
  string name = 2;
  uint64 offset = 3;
  uint64 generation = 4;
  bool drop = 5;
}

// SinkSkip records a change a sink with on_error=skip could not deliver
// and passed over (design D28). The change itself stays in the log at
// index.
message SinkSkip {
  string sink = 1;
  uint64 index = 2;
  // The change's id ("<commit LSN>:<seq>").
  string id = 3;
  string error = 4;
  int64 time_us = 5;
}

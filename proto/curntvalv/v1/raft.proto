syntax = "proto3";

package curntvalv.v1;

option go_package = "github.com/Vympel87/curntvalv/internal/pb/curntvalv/v1;pb";

// RaftService carries Raft messages between the nodes of a cluster.
service RaftService {
  // Stream is a long-lived, one-way stream of Raft messages from one node to
  // another. Replies travel on the reverse stream, opened by the other node.
  rpc Stream(stream StreamRequest) returns (StreamResponse);
}

message StreamRequest {
  RaftMessage message = 1;
}

message StreamResponse {}

// RaftMessage mirrors raft.Message field by field.
message RaftMessage {
  uint32 type = 1;
  uint64 from = 2;
  uint64 to = 3;
  uint64 term = 4;
  uint64 last_log_index = 5;
  uint64 last_log_term = 6;
  uint64 prev_log_index = 7;
  uint64 prev_log_term = 8;
  repeated Entry entries = 9;
  uint64 leader_commit = 10;
  bool vote_granted = 11;
  bool success = 12;
  uint64 match_index = 13;
  Snapshot snapshot = 14;
  uint64 read_id = 15;
}

message Entry {
  uint64 index = 1;
  uint64 term = 2;
  uint32 type = 3;
  bytes data = 4;
}

message Snapshot {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
}

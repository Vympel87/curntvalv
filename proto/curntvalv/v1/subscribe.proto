syntax = "proto3";

package curntvalv.v1;

option go_package = "github.com/Vympel87/curntvalv/internal/pb/curntvalv/v1;pb";

import "curntvalv/v1/event.proto";

// SubscribeService streams row changes to applications. Any node can serve
// it; a follower may be a little behind the leader. Offsets are managed by
// the client: to resume, subscribe again with the last next_index received,
// or keep them in the cluster with a named subscription (design D22).
// Delivery is at-least-once around a resume; ChangeEvent.id identifies a
// change across redeliveries (design D4).
service SubscribeService {
  // Subscribe sends the stored changes from from_index on, then keeps the
  // stream open and sends new changes as they are committed. It fails with
  // OUT_OF_RANGE if from_index was removed by log compaction.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  // JoinSubscription returns the stored position of a named subscription,
  // creating it if it does not exist. Leader only.
  rpc JoinSubscription(JoinSubscriptionRequest) returns (JoinSubscriptionResponse);
  // CommitSubscription stores that the subscriber processed everything up
  // to and including offset. ABORTED if the subscription was reset (join
  // again), NOT_FOUND if it was deleted. Leader only.
  rpc CommitSubscription(CommitSubscriptionRequest) returns (CommitSubscriptionResponse);
}

enum SubscriptionStart {
  SUBSCRIPTION_START_UNSPECIFIED = 0;
  // A new subscription starts with the oldest retained entry (default).
  SUBSCRIPTION_START_EARLIEST = 1;
  // A new subscription starts with the next committed entry.
  SUBSCRIPTION_START_LATEST = 2;
}

message JoinSubscriptionRequest {
  string name = 1;
  // For a new subscription only.
  SubscriptionStart start = 2;
  bool drop = 3;
  // Do not create it: NOT_FOUND if it does not exist.
  bool must_exist = 4;
}

message JoinSubscriptionResponse {
  Subscription subscription = 1;
  // The subscription did not exist before.
  bool created = 2;
}

message CommitSubscriptionRequest {
  string name = 1;
  uint64 generation = 2;
  uint64 offset = 3;
}

message CommitSubscriptionResponse {}

message SubscribeRequest {
  // First log index to read; 0 means the oldest retained entry.
  uint64 from_index = 1;
  // Tables to receive, as "name" (any namespace) or "namespace.name".
  // Empty means all tables.
  repeated string tables = 2;
  // Send whole transactions (design D30): every change of a transaction
  // carries tx_changes, the number of its changes the stream sends. A
  // transaction may span several responses; next_index never points into
  // one, so resuming there sends it again from its start.
  bool transactions = 3;
  // Send an event with op OP_SCHEMA when a table's definition changes,
  // before its first change under the new one (design D31).
  bool schema_changes = 4;
}

message SubscribeResponse {
  repeated ChangeEvent events = 1;
  // Schemas referenced by events that were not sent earlier on this stream.
  map<uint64, Schema> schemas = 2;
  // Index to subscribe from to continue after this response. It also moves
  // forward when no event matched, so a resume skips entries already seen.
  uint64 next_index = 3;
}

// ChangeEvent is one row change.
message ChangeEvent {
  // Idempotency key: "<commit LSN>:<seq>", e.g. "0/15185F8:3".
  string id = 1;
  // Raft index of the log entry holding the change.
  uint64 index = 2;
  uint64 commit_lsn = 3;
  // Position of the change in its transaction.
  uint32 seq = 4;
  uint32 xid = 5;
  int64 commit_time_us = 6;
  Event event = 7;
  // With transactions: how many changes of this transaction the stream
  // sends. 0 for a change that stands alone (design D30).
  uint32 tx_changes = 8;
}

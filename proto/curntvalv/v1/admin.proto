syntax = "proto3";

package curntvalv.v1;

option go_package = "github.com/Vympel87/curntvalv/internal/pb/curntvalv/v1;pb";

import "curntvalv/v1/event.proto";

// AdminService is the operator API of a node: cluster status and the metadata
// key-value store. Writes and reads must go to the leader; other nodes answer
// FAILED_PRECONDITION with the leader's id and address in the message.
service AdminService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Put(PutRequest) returns (PutResponse);
  // Get is linearizable (Raft read-only protocol, section 8).
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // ReadLog returns committed log entries. Any node can serve it; a follower
  // may be a little behind the leader. Entries removed by log compaction
  // give OUT_OF_RANGE.
  rpc ReadLog(ReadLogRequest) returns (ReadLogResponse);
  // ResetSink moves a configured sink to another position, also backwards
  // (replay), and starts a new generation of its offsets. Leader only.
  rpc ResetSink(ResetSinkRequest) returns (ResetSinkResponse);
  // ResetSource moves the Postgres source to the current position of its
  // replication slot (creating the slot if it is missing) after a failover
  // check stopped ingest (design D7). It stores an OP_SOURCE_RESET event so
  // sinks and subscribers see the gap. Leader only, and only while the
  // source on the leader is "failed".
  rpc ResetSource(ResetSourceRequest) returns (ResetSourceResponse);
  // StartBackfill queues tables to be read in full into the log (design
  // D17). Each table must have a primary key and be in the publication.
  // Leader only.
  rpc StartBackfill(StartBackfillRequest) returns (StartBackfillResponse);
  // CancelBackfill stops pending backfills. Leader only.
  rpc CancelBackfill(CancelBackfillRequest) returns (CancelBackfillResponse);
  // AddMember adds a server to the cluster (design D18): as a learner
  // first, then, once it has caught up, as a voter. It returns when the
  // server is a voter. Leader only; calling it again is safe.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  // RemoveMember removes a server. Removing the leader makes it step down.
  // Leader only.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // ResetSubscription moves a named subscription (design D22), also
  // backwards, and starts a new generation. Leader only.
  rpc ResetSubscription(ResetSubscriptionRequest) returns (ResetSubscriptionResponse);
  // DeleteSubscription removes a named subscription, so it no longer holds
  // the log. Leader only.
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);
  // SinkSkips lists the changes a sink passed over (design D28), the most
  // recent last. Any node can answer.
  rpc SinkSkips(SinkSkipsRequest) returns (SinkSkipsResponse);
}

message SinkSkipsRequest {
  string name = 1;
}

message SinkSkipsResponse {
  uint64 total = 1;
  // At most the last 100.
  repeated SinkSkip recent = 2;
}

message StatusRequest {}

message StatusResponse {
  uint64 id = 1;
  uint64 term = 2;
  string state = 3;
  uint64 leader = 4;
  string leader_addr = 5;
  uint64 first_index = 6;
  uint64 last_index = 7;
  uint64 commit_index = 8;
  uint64 last_applied = 9;
  uint64 snapshot_index = 10;
  // Postgres source on this node: "" (none configured), "standby" (not the
  // leader), "running", "retrying", "failed" or "resetting".
  string source_state = 11;
  string source_error = 12;
  repeated SinkStatus sinks = 13;
  // Log retention on this node; unset on nodes without it (tests).
  RetentionStatus retention = 14;
  // Backfills (replicated), in the order they were started.
  repeated Backfill backfills = 15;
  // The cluster configuration in effect on this node, sorted by id.
  repeated Member members = 16;
  // Log index of the configuration's entry; 0 if it comes from a snapshot
  // or from --peers.
  uint64 config_index = 17;
  // Named subscriptions (replicated), by name.
  repeated SubscriptionStatus subscriptions = 18;
}

message SubscriptionStatus {
  string name = 1;
  uint64 offset = 2;
  uint64 generation = 3;
  // "block" or "drop".
  string policy = 4;
  // Log entries between the offset and the newest entry with row changes.
  uint64 lag = 5;
}

message ResetSubscriptionRequest {
  string name = 1;
  ResetPosition position = 2;
  // With RESET_POSITION_INDEX: the new offset.
  uint64 index = 3;
}

message ResetSubscriptionResponse {
  uint64 index = 1;
  Subscription subscription = 2;
}

message DeleteSubscriptionRequest {
  string name = 1;
}

message DeleteSubscriptionResponse {
  uint64 index = 1;
}

message Member {
  uint64 id = 1;
  string addr = 2;
  // false: a learner, which receives the log but does not vote.
  bool voter = 3;
  // On the leader: the highest log index stored on this member.
  uint64 match_index = 4;
}

message AddMemberRequest {
  uint64 id = 1;
  string addr = 2;
}

message AddMemberResponse {
  // Index of the last configuration entry.
  uint64 index = 1;
}

message RemoveMemberRequest {
  uint64 id = 1;
}

message RemoveMemberResponse {
  uint64 index = 1;
}

message RetentionStatus {
  // Configured limits; 0 means none.
  int64 max_age_seconds = 1;
  int64 max_bytes = 2;
  // Current size of the log on this node.
  int64 log_bytes = 3;
  // Highest index that may be removed now.
  uint64 compact_limit = 4;
  // The block sink holding compact_limit back, if any.
  string blocked_by = 5;
}

message SinkStatus {
  string name = 1;
  string type = 2;
  // On this node: "standby" (not the leader), "running", "retrying" or
  // "failed".
  string state = 3;
  // Last log index the sink has delivered (replicated, the same on every
  // node); 0 if it has not stored one yet.
  uint64 offset = 4;
  // Log entries between the offset and the newest entry with row changes;
  // 0 when the sink has everything.
  uint64 lag = 5;
  // Changes delivered by this node since it started.
  uint64 delivered = 6;
  string last_error = 7;
  // "block" (the log keeps what the sink has not delivered) or "drop".
  string policy = 8;
  // Number of resets (replicated).
  uint64 generation = 9;
  // Failed deliveries on this node since it started.
  uint64 failures = 10;
  // Changes passed over with on_error=skip (replicated, design D28).
  uint64 skipped = 11;
  // "retry" or "skip".
  string on_error = 12;
}

message ResetSinkRequest {
  string name = 1;
  ResetPosition position = 2;
  // With RESET_POSITION_INDEX: the new offset, i.e. the last log index
  // counted as delivered. Delivery continues after it.
  uint64 index = 3;
}

enum ResetPosition {
  RESET_POSITION_UNSPECIFIED = 0;
  // Replay everything still retained.
  RESET_POSITION_EARLIEST = 1;
  // Skip to the current commit index.
  RESET_POSITION_LATEST = 2;
  RESET_POSITION_INDEX = 3;
}

message ResetSinkResponse {
  // Raft index at which the reset was committed.
  uint64 index = 1;
  // New offset (0 for earliest) and generation.
  uint64 offset = 2;
  uint64 generation = 3;
}

message ResetSourceRequest {}

message ResetSourceResponse {
  // Raft index at which the reset was committed.
  uint64 index = 1;
  SourceReset source_reset = 2;
}

message StartBackfillRequest {
  // Table names as Postgres resolves them ("orders", "sales.orders").
  repeated string tables = 1;
}

message StartBackfillResponse {
  // Raft index at which the command was committed.
  uint64 index = 1;
  // The tables as "namespace.name".
  repeated string tables = 2;
}

message CancelBackfillRequest {
  // "namespace.name", or just the name if only one backfill has it.
  repeated string tables = 1;
}

message CancelBackfillResponse {
  uint64 index = 1;
  repeated string tables = 2;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  // Raft index at which the write was committed.
  uint64 index = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  uint64 read_index = 3;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  uint64 index = 1;
}

message ReadLogRequest {
  // First index to return; 0 means the oldest retained entry.
  uint64 from_index = 1;
  // Maximum number of entries; 0 means a server default.
  uint32 limit = 2;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_NOOP = 1;
  ENTRY_KIND_META = 2;
  ENTRY_KIND_TX_BATCH = 3;
  // A cluster configuration (design D18).
  ENTRY_KIND_CONFIG = 4;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  EntryKind kind = 3;
  // Set when kind is ENTRY_KIND_TX_BATCH.
  TxBatch tx_batch = 4;
}

message ReadLogResponse {
  repeated LogEntry entries = 1;
  // Oldest index still in this node's log.
  uint64 first_index = 2;
  // This node's commit index; entries are never returned past it.
  uint64 commit_index = 3;
  // Every schema referenced by the returned batches, by id.
  map<uint64, Schema> schemas = 4;
}

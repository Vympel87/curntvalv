syntax = "proto3";

package curntvalv.v1;

option go_package = "github.com/Vympel87/curntvalv/internal/pb/curntvalv/v1;pb";

// AdminService is the operator API of a node: cluster status and the metadata
// key-value store. Writes and reads must go to the leader; other nodes answer
// FAILED_PRECONDITION with the leader's id and address in the message.
service AdminService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Put(PutRequest) returns (PutResponse);
  // Get is linearizable (Raft read-only protocol, section 8).
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message StatusRequest {}

message StatusResponse {
  uint64 id = 1;
  uint64 term = 2;
  string state = 3;
  uint64 leader = 4;
  string leader_addr = 5;
  uint64 first_index = 6;
  uint64 last_index = 7;
  uint64 commit_index = 8;
  uint64 last_applied = 9;
  uint64 snapshot_index = 10;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  // Raft index at which the write was committed.
  uint64 index = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  uint64 read_index = 3;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  uint64 index = 1;
}

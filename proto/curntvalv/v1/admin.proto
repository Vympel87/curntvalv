syntax = "proto3";

package curntvalv.v1;

option go_package = "github.com/Vympel87/curntvalv/internal/pb/curntvalv/v1;pb";

import "curntvalv/v1/event.proto";

// AdminService is the operator API of a node: cluster status and the metadata
// key-value store. Writes and reads must go to the leader; other nodes answer
// FAILED_PRECONDITION with the leader's id and address in the message.
service AdminService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Put(PutRequest) returns (PutResponse);
  // Get is linearizable (Raft read-only protocol, section 8).
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // ReadLog returns committed log entries. Any node can serve it; a follower
  // may be a little behind the leader. Entries removed by log compaction
  // give OUT_OF_RANGE.
  rpc ReadLog(ReadLogRequest) returns (ReadLogResponse);
  // ResetSink moves a configured sink to another position, also backwards
  // (replay), and starts a new generation of its offsets. Leader only.
  rpc ResetSink(ResetSinkRequest) returns (ResetSinkResponse);
}

message StatusRequest {}

message StatusResponse {
  uint64 id = 1;
  uint64 term = 2;
  string state = 3;
  uint64 leader = 4;
  string leader_addr = 5;
  uint64 first_index = 6;
  uint64 last_index = 7;
  uint64 commit_index = 8;
  uint64 last_applied = 9;
  uint64 snapshot_index = 10;
  // Postgres source on this node: "" (none configured), "standby" (not the
  // leader), "running", "retrying" or "failed".
  string source_state = 11;
  string source_error = 12;
  repeated SinkStatus sinks = 13;
  // Log retention on this node; unset on nodes without it (tests).
  RetentionStatus retention = 14;
}

message RetentionStatus {
  // Configured limits; 0 means none.
  int64 max_age_seconds = 1;
  int64 max_bytes = 2;
  // Current size of the log on this node.
  int64 log_bytes = 3;
  // Highest index that may be removed now.
  uint64 compact_limit = 4;
  // The block sink holding compact_limit back, if any.
  string blocked_by = 5;
}

message SinkStatus {
  string name = 1;
  string type = 2;
  // On this node: "standby" (not the leader), "running", "retrying" or
  // "failed".
  string state = 3;
  // Last log index the sink has delivered (replicated, the same on every
  // node); 0 if it has not stored one yet.
  uint64 offset = 4;
  // Log entries between the offset and the newest entry with row changes;
  // 0 when the sink has everything.
  uint64 lag = 5;
  // Changes delivered by this node since it started.
  uint64 delivered = 6;
  string last_error = 7;
  // "block" (the log keeps what the sink has not delivered) or "drop".
  string policy = 8;
  // Number of resets (replicated).
  uint64 generation = 9;
}

message ResetSinkRequest {
  string name = 1;
  ResetPosition position = 2;
  // With RESET_POSITION_INDEX: the new offset, i.e. the last log index
  // counted as delivered. Delivery continues after it.
  uint64 index = 3;
}

enum ResetPosition {
  RESET_POSITION_UNSPECIFIED = 0;
  // Replay everything still retained.
  RESET_POSITION_EARLIEST = 1;
  // Skip to the current commit index.
  RESET_POSITION_LATEST = 2;
  RESET_POSITION_INDEX = 3;
}

message ResetSinkResponse {
  // Raft index at which the reset was committed.
  uint64 index = 1;
  // New offset (0 for earliest) and generation.
  uint64 offset = 2;
  uint64 generation = 3;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  // Raft index at which the write was committed.
  uint64 index = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  uint64 read_index = 3;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  uint64 index = 1;
}

message ReadLogRequest {
  // First index to return; 0 means the oldest retained entry.
  uint64 from_index = 1;
  // Maximum number of entries; 0 means a server default.
  uint32 limit = 2;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_NOOP = 1;
  ENTRY_KIND_META = 2;
  ENTRY_KIND_TX_BATCH = 3;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  EntryKind kind = 3;
  // Set when kind is ENTRY_KIND_TX_BATCH.
  TxBatch tx_batch = 4;
}

message ReadLogResponse {
  repeated LogEntry entries = 1;
  // Oldest index still in this node's log.
  uint64 first_index = 2;
  // This node's commit index; entries are never returned past it.
  uint64 commit_index = 3;
  // Every schema referenced by the returned batches, by id.
  map<uint64, Schema> schemas = 4;
}

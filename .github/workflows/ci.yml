name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Service containers cannot take command arguments, so logical
        # replication is enabled with ALTER SYSTEM + restart below.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_PASSWORD: curntvalv
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --password curntvalv -q 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: curntvalv-test-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_NUM_PARTITIONS: "3"
        ports:
          - 9092:9092
    env:
      CURNTVALV_TEST_KAFKA_URL: kafka://localhost:9092
      CURNTVALV_TEST_REDIS_URL: redis://localhost:6379
      CURNTVALV_TEST_MEILI_URL: http://:curntvalv-test-key@localhost:7700
      CURNTVALV_TEST_NATS_URL: nats://localhost:4222
      CURNTVALV_TEST_S3_ENDPOINT: http://localhost:8333
      CURNTVALV_TEST_CH_URL: http://default:curntvalv@localhost:8123
      CURNTVALV_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Enable logical replication in the Postgres service
        run: |
          id=$(docker ps --filter "ancestor=postgres:17" --format '{{.ID}}')
          docker exec "$id" psql -U postgres -c "ALTER SYSTEM SET wal_level = logical"
          docker exec "$id" psql -U postgres -c "ALTER SYSTEM SET max_replication_slots = 20"
          docker exec "$id" psql -U postgres -c "ALTER SYSTEM SET max_wal_senders = 20"
          docker restart "$id"
          until docker exec "$id" pg_isready -U postgres; do sleep 1; done
      # Service containers cannot take command arguments, and NATS needs -js.
      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10 -js
      - uses: actions/checkout@v4
      # An S3-compatible store that checks signatures, with a test bucket.
      - name: Start SeaweedFS S3
        run: |
          docker run -d --name s3 -p 8333:8333 -v "$PWD/internal/sink/testdata/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:3.80 server -s3 -s3.config=/etc/s3.json -dir=/data
          until docker exec s3 sh -c "echo 's3.bucket.create -name curntvalv-test' | weed shell" 2>&1 | grep -qE 'created bucket|already exists'; do sleep 1; done
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - name: make test
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log
      # Annotations are readable without access to the job log: name the
      # failing tests and a few lines of their output.
      - name: Report failed tests
        if: failure()
        run: |
          awk '/--- FAIL|^panic:|DATA RACE|^FAIL\t/ { n++; if (n > 10) exit; msg = $0; for (i = 0; i < 12 && (getline line) > 0; i++) msg = msg "%0A" line; gsub(/::/, ": :", msg); print "::error title=" (n == 1 ? "first failure" : "failure " n) "::" msg }' test.log

  # A real Postgres 17 failover per scenario (design D7).
  failover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-failover

  # Upgrades from every release they are supported from (design D34):
  # rolling and stopped, or stopped only for the oldest.
  upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {from: v0.10.0}
          - {from: v0.9.0}
          - {from: v0.8.0}
          - {from: v0.7.0}
          - {from: v0.6.0}
          - {from: v0.5.0}
          - {from: v0.4.0}
          - {from: v0.3.0, stopped: true}
          - {from: v0.2.1, stopped: true}
    name: upgrade from ${{ matrix.from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag of the release to upgrade from
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make test-upgrade
        run: |
          if [ "${{ matrix.stopped }}" = true ]; then
            make test-upgrade UPGRADE_FROM= STOPPED_UPGRADE_FROM=${{ matrix.from }}
          else
            make test-upgrade UPGRADE_FROM=${{ matrix.from }} STOPPED_UPGRADE_FROM=
          fi
